name: RaktSetu Safe Dependency Remediation

on:
  push:
    branches: [deploy/raktsetu-single-vercel]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raktsetu-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/raktsetu-single-vercel
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remediate deployment-root dependencies and verify deployment build
        run: |
          npm install --no-fund
          npm audit fix --no-fund
          npm run build
      - name: Refresh frontend dependency tree and apply non-breaking security fixes
        working-directory: raktsetufrontend
        run: |
          npm install --no-audit --no-fund
          npm audit fix --no-fund || true
      - name: Verify frontend tests and production build
        working-directory: raktsetufrontend
        env:
          CI: "true"
        run: |
          npm test
          CI=false npm run build
      - name: Upgrade vulnerable Multer major and apply backend security fixes
        working-directory: raktsetuBackend/raktsetu-backend
        run: |
          npm install multer@^2.0.2 --save --no-fund
          npm audit fix --no-fund || true
      - name: Verify backend tests and syntax
        working-directory: raktsetuBackend/raktsetu-backend
        run: |
          npm test
          find . -path './node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit tested dependency updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json raktsetufrontend/package.json raktsetufrontend/package-lock.json raktsetuBackend/raktsetu-backend/package.json raktsetuBackend/raktsetu-backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "Apply tested dependency security fixes"
            git push origin HEAD:deploy/raktsetu-single-vercel
          fi
