name: RaktSetu Dependency Security Audit

on:
  push:
    branches: [main, deploy/raktsetu-single-vercel]
  pull_request:
    branches: [main, deploy/raktsetu-single-vercel]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deployment-root
            directory: .
          - name: frontend
            directory: raktsetufrontend
          - name: backend
            directory: raktsetuBackend/raktsetu-backend
    name: Audit ${{ matrix.name }} dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and reconcile the dependency tree
        working-directory: ${{ matrix.directory }}
        run: npm install --no-audit --no-fund
      - name: Generate npm audit report
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          npm audit --json > audit-report.json || true
          node - <<'NODE'
          const fs = require('fs');
          let report = {};
          try { report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8')); }
          catch (error) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n## Audit report unavailable\nThe npm audit output could not be parsed.\n');
            process.exit(0);
          }
          const v = report.metadata?.vulnerabilities || {};
          const summary = [
            '## ' + process.env.AUDIT_NAME + ' dependency audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            '| Critical | ' + (v.critical || 0) + ' |',
            '| High | ' + (v.high || 0) + ' |',
            '| Moderate | ' + (v.moderate || 0) + ' |',
            '| Low | ' + (v.low || 0) + ' |',
            '| Total | ' + (v.total || 0) + ' |',
            '',
            'This job reports dependency risk without automatically applying potentially breaking upgrades.'
          ].join('\n') + '\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({ package: name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable }));
          }
          NODE
        env:
          AUDIT_NAME: ${{ matrix.name }}
      - name: Upload raw npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.name }}
          path: ${{ matrix.directory }}/audit-report.json
          if-no-files-found: warn
          retention-days: 14
