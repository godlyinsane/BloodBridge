<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bloodbridge-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0B0E" />
    <meta name="description" content="BloodBridge connects blood donors, recipients, donation camps and blood banks. Check listings and contact details in one place." />
    <meta property="og:site_name" content="BloodBridge" />
    <meta property="og:title" content="BloodBridge | Blood Donation Network" />
    <meta property="og:description" content="BloodBridge connects blood donors, recipients, donation camps and blood banks. Check listings and contact details in one place." />
    <meta property="og:url" content="https://blood-bank-mern-gold.vercel.app/" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BloodBridge",
        "alternateName": ["BloodBridge Blood Donation Network", "blood-bank-mern-gold.vercel.app"],
        "url": "https://blood-bank-mern-gold.vercel.app/"
      }
    </script>
    <title>BloodBridge | Blood Donation Network</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('bloodbridge-theme') || 'dark';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.classList.toggle('theme-light', t === 'light');
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
